<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{DECK_TITLE}}</title>
<style>
/* ===== Design tokens. Light is the default theme; add class="dark" to <html> for the dark variant. ===== */
:root{
  --color-page-bg: #f7f6f2;
  --color-ink: #17202c;
  --color-accent: #0f766e;
  --color-accent-light: #5eead4;
  --color-accent-active: #0d9488;
  --color-accent-soft: #ccfbf1;
  --color-accent-rgb: 15, 118, 110;
  --color-secondary: #4f46e5;
  --color-secondary-soft: #e0e7ff;
  --color-background: #f7f6f2;
  --color-background-secondary: #efeee8;
  --color-background-table-header: #f1f0ea;
  --color-surface: #ffffff;
  --color-surface-secondary: #fbfaf7;
  --color-foreground: #17202c;
  --color-foreground-secondary: #475467;
  --color-foreground-muted: #667085;
  --color-border: #e4e2da;
  --color-status-info: #2563eb;
  --color-status-success: #15803d;
  --color-status-warning: #b45309;
  --color-status-danger: #b91c1c;
  --color-status-neutral: #7c3aed;
  --color-diff-add-bg: #e7f6ec;
  --color-diff-add-fg: #166534;
  --color-diff-del-bg: #fdecec;
  --color-diff-del-fg: #991b1b;
  --color-diagram-primary-bg: #ecfdf9;
  --color-diagram-primary-border: #0f766e;
  --color-diagram-secondary-bg: #eef2ff;
  --color-diagram-secondary-border: #4f46e5;
  --color-diagram-external-bg: #ffffff;
  --color-diagram-external-border: rgba(23, 32, 44, 0.35);
  --color-diagram-group-bg: rgba(23, 32, 44, 0.03);
  --color-diagram-group-border: rgba(23, 32, 44, 0.2);
  --color-diagram-edge: #667085;
  --color-diagram-edge-flow: #0f766e;
  --color-github-surface: #ffffff;
  --color-github-border: #d1d9e0;
  --color-github-text: #1f2328;
  --color-github-muted: #59636e;
  --color-github-open: #1f883d;
  --color-github-merged: #8250df;
  --color-github-closed: #cf222e;
  --font-heading: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --font-sans: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --shadow-card: 0 1px 2px rgba(23, 32, 44, 0.04), 0 8px 24px rgba(23, 32, 44, 0.06);
  --radius: 14px;
}
.dark{
  --color-page-bg: #0f141b;
  --color-background: #0f141b;
  --color-background-secondary: #161d27;
  --color-background-table-header: #131a23;
  --color-surface: #1a2230;
  --color-surface-secondary: #212b3a;
  --color-foreground: #f3f4f6;
  --color-foreground-secondary: #c7ced9;
  --color-foreground-muted: #8b95a5;
  --color-border: rgba(255, 255, 255, 0.1);
  --color-accent: #2dd4bf;
  --color-accent-active: #5eead4;
  --color-accent-soft: rgba(45, 212, 191, 0.14);
  --color-accent-rgb: 45, 212, 191;
  --color-secondary: #a5b4fc;
  --color-secondary-soft: rgba(165, 180, 252, 0.14);
  --color-diff-add-bg: rgba(74, 222, 128, 0.12);
  --color-diff-add-fg: #86efac;
  --color-diff-del-bg: rgba(248, 113, 113, 0.12);
  --color-diff-del-fg: #fca5a5;
  --color-diagram-primary-bg: rgba(45, 212, 191, 0.1);
  --color-diagram-primary-border: #2dd4bf;
  --color-diagram-secondary-bg: rgba(165, 180, 252, 0.1);
  --color-diagram-secondary-border: #a5b4fc;
  --color-diagram-external-bg: rgba(255, 255, 255, 0.03);
  --color-diagram-external-border: rgba(255, 255, 255, 0.35);
  --color-diagram-group-bg: rgba(255, 255, 255, 0.03);
  --color-diagram-group-border: rgba(255, 255, 255, 0.2);
  --color-github-surface: #0d1117;
  --color-github-border: #3d444d;
  --color-github-text: #e6edf3;
  --color-github-muted: #9198a1;
  --shadow-card: none;
}

/* ===== Frame: full-screen sections, progress bar, side navigation ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
html{scroll-snap-type:y proximity;scroll-behavior:smooth;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{background:var(--color-page-bg);color:var(--color-foreground);font-family:var(--font-sans);overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--font-heading);letter-spacing:-.02em}
code,pre{font-family:var(--font-mono)}
.slide{position:relative;width:100vw;min-height:100vh;min-height:100dvh;scroll-snap-align:start;
  padding:clamp(28px,7vh,72px) calc(clamp(20px,6vw,96px) + 20px) clamp(28px,7vh,72px) clamp(20px,6vw,96px);
  display:flex;flex-direction:column;gap:clamp(12px,2.5vh,24px)}
.slide + .slide{border-top:1px solid var(--color-border)}
.pretitle{margin:0;display:flex;align-items:center;gap:.625rem;font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent)}
.pretitle::before{content:"";width:1.75rem;height:2px;border-radius:2px;background:currentColor}
.title{margin:0;max-width:62rem;font-weight:700;font-size:clamp(1.75rem,3.2vw,2.75rem);line-height:1.15;color:var(--color-foreground)}
.lede{margin:0;max-width:52rem;font-size:clamp(1rem,1.3vw,1.2rem);line-height:1.55;color:var(--color-foreground-secondary)}
.explain{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-top:clamp(8px,2vh,24px)}

.deck-progress{position:fixed;left:0;right:0;top:0;height:4px;background:var(--color-border);z-index:60}
.deck-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--color-accent),var(--color-secondary));transition:width .15s linear}
.deck-nav{position:fixed;right:clamp(8px,1.4vw,22px);top:50%;transform:translateY(-50%);z-index:55;max-height:84vh}
.deck-nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;align-items:flex-end;gap:clamp(2px,.9vh,8px)}
.deck-nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:3px 0;font:500 .75rem var(--font-sans);color:var(--color-foreground-muted)}
.deck-nav .lbl{opacity:0;transition:opacity .2s;white-space:nowrap;background:var(--color-surface);border:1px solid var(--color-border);border-radius:999px;padding:2px 10px;box-shadow:var(--shadow-card)}
.deck-nav .dot{width:8px;height:8px;border-radius:50%;border:2px solid color-mix(in srgb,var(--color-foreground-muted) 55%,transparent);transition:transform .25s,background .25s,border-color .25s}
.deck-nav button:hover .lbl,.deck-nav button:focus-visible .lbl{opacity:1}
.deck-nav button:focus-visible .dot{outline:2px solid var(--color-accent);outline-offset:3px}
.deck-nav button[aria-current="true"] .dot{transform:scale(1.4);background:var(--color-accent);border-color:var(--color-accent)}
@media (max-width:820px){.deck-nav .lbl{display:none}}
pre.mermaid:not([data-processed]){color:transparent}

/* Lucide icons (https://lucide.dev, paste the SVG): sized by font-size, coloured by text colour */
.lucide{flex-shrink:0;vertical-align:-.125em}

/* ===== Components (reference) =====
   Use them, change them, and create new ones in the same look and feel whenever a slide needs it. */

/* Background: warm paper with a faint dot grid, fixed behind every section */
.pr-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--color-page-bg)}
.pr-bg::before{content:"";position:absolute;inset:0;opacity:.55;
  background-image:radial-gradient(color-mix(in srgb,var(--color-foreground-muted) 35%,transparent) 1px,transparent 1px);background-size:22px 22px;
  mask-image:linear-gradient(180deg,#000 0%,transparent 70%);-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 70%)}
.pr-bg::after{content:"";position:absolute;width:60vw;height:60vw;right:-20vw;top:-25vw;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--color-accent-rgb),.10) 0%,transparent 65%)}

/* Cover: PR title and summary on the left, stat tiles and the topic list on the right */
.pr-cover-grid{margin-top:1rem;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(1.5rem,4vw,4rem);align-items:start;max-width:78rem}
.pr-stats{margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
.pr-stats .card{padding:1rem 1.125rem}
.pr-stats dt{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--color-foreground-muted)}
.pr-stats dd{margin:.375rem 0 0;font:700 1.9rem/1.1 var(--font-heading);color:var(--color-foreground)}
.pr-stats dd.add{color:var(--color-diff-add-fg)} .pr-stats dd.del{color:var(--color-diff-del-fg)}
.pr-topic-list{list-style:none;counter-reset:topic;margin:.75rem 0 0;padding:0;display:flex;flex-direction:column;gap:.25rem}
.pr-topic-list a{counter-increment:topic;display:flex;gap:.875rem;align-items:baseline;padding:.6rem .25rem;border-bottom:1px solid var(--color-border);font-size:1.05rem;color:var(--color-foreground);text-decoration:none}
.pr-topic-list a::before{content:counter(topic,decimal-leading-zero);font:600 .8rem var(--font-mono);color:var(--color-accent)}
.pr-topic-list a:hover{color:var(--color-accent)}
@media (max-width:820px){.pr-cover-grid{grid-template-columns:1fr}.pr-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Card */
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:1.5rem}

/* Small uppercase label */
.pr-label{display:inline-flex;align-items:center;gap:.375rem;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--color-foreground-muted)}

/* Buttons */
.pr-btn{display:inline-flex;align-items:center;gap:.5rem;border:1px solid transparent;border-radius:999px;padding:.5rem 1.1rem;font:600 .95rem var(--font-sans)}
.pr-btn--primary{background:var(--color-accent);color:#fff}
.pr-btn--secondary{background:var(--color-secondary-soft);color:var(--color-secondary)}

/* Chips, pills and badges */
.pr-chips{display:flex;flex-wrap:wrap;gap:.5rem}
.pr-chip{display:inline-flex;align-items:center;gap:.5rem;padding:.375rem .75rem;border:1px solid var(--color-border);border-radius:.5rem;background:var(--color-surface);font-size:.875rem;color:var(--color-foreground-secondary)}
.pr-chip svg{width:.85rem;height:.85rem}
.pr-chip.is-active{border-color:rgba(var(--color-accent-rgb),.45);background:var(--color-accent-soft);color:var(--color-accent)}
.pr-pill{display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .75rem;border-radius:999px;background:var(--color-secondary-soft);font-size:.8rem;font-weight:600;color:var(--color-secondary)}
.pr-badge{display:inline-flex;align-items:center;gap:.25rem;padding:.125rem .5rem;border-radius:999px;font:600 .72rem var(--font-mono)}
.pr-badge--add{background:var(--color-diff-add-bg);color:var(--color-diff-add-fg)}
.pr-badge--del{background:var(--color-diff-del-bg);color:var(--color-diff-del-fg)}
.pr-badge--mod{background:var(--color-secondary-soft);color:var(--color-secondary)}

/* Outcome callout: the "so what" of a slide */
.pr-outcome{display:flex;gap:.875rem;align-items:flex-start;max-width:40rem;border-left:4px solid var(--color-accent);background:var(--color-accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:1rem 1.25rem;font-size:1.05rem;line-height:1.5}
.pr-outcome svg{margin-top:.2rem;color:var(--color-accent);width:1.25rem;height:1.25rem}

/* Before / after comparison */
.pr-compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem;width:min(100%,64rem)}
.pr-compare .card{display:flex;flex-direction:column;gap:.75rem}
.pr-compare .is-before{border-top:4px solid var(--color-status-danger)}
.pr-compare .is-after{border-top:4px solid var(--color-status-success)}
@media (max-width:820px){.pr-compare{grid-template-columns:1fr}}

/* Status panels: info, success, warning, danger */
.pr-info{display:flex;align-items:flex-start;gap:.625rem;border:1px solid;border-radius:.625rem;padding:.75rem 1rem;font-size:.9rem;line-height:1.55;color:var(--color-foreground-secondary)}
.pr-info svg{margin-top:.2rem;width:1rem;height:1rem}
.pr-info--info{border-color:color-mix(in srgb,var(--color-status-info) 30%,transparent);background:color-mix(in srgb,var(--color-status-info) 8%,transparent)} .pr-info--info svg{color:var(--color-status-info)}
.pr-info--success{border-color:color-mix(in srgb,var(--color-status-success) 30%,transparent);background:color-mix(in srgb,var(--color-status-success) 8%,transparent)} .pr-info--success svg{color:var(--color-status-success)}
.pr-info--warning{border-color:color-mix(in srgb,var(--color-status-warning) 30%,transparent);background:color-mix(in srgb,var(--color-status-warning) 8%,transparent)} .pr-info--warning svg{color:var(--color-status-warning)}
.pr-info--danger{border-color:color-mix(in srgb,var(--color-status-danger) 30%,transparent);background:color-mix(in srgb,var(--color-status-danger) 8%,transparent)} .pr-info--danger svg{color:var(--color-status-danger)}

/* Expandable technical evidence: collapsed by default, one per topic slide */
.pr-evidence{width:min(100%,64rem);border:1px solid var(--color-border);border-radius:var(--radius);background:var(--color-surface-secondary)}
.pr-evidence>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:.625rem;padding:.875rem 1.125rem;font-weight:600;font-size:.9rem;color:var(--color-foreground-secondary)}
.pr-evidence>summary::-webkit-details-marker{display:none}
.pr-evidence>summary::after{content:"+";margin-left:auto;font:500 1.2rem/1 var(--font-mono);color:var(--color-accent)}
.pr-evidence[open]>summary::after{content:"–"}
.pr-evidence[open]>summary{border-bottom:1px solid var(--color-border)}
.pr-evidence__body{padding:1rem 1.125rem;display:flex;flex-direction:column;gap:1rem;max-height:55vh;overflow:auto}
.pr-files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.25rem;font:500 .85rem var(--font-mono)}
.pr-files li{display:flex;align-items:center;gap:.625rem;justify-content:space-between;padding:.35rem .5rem;border-radius:.375rem}
.pr-files li:nth-child(odd){background:var(--color-background-secondary)}
.pr-files .delta{display:flex;gap:.375rem}
.pr-diff{margin:0;border:1px solid var(--color-border);border-radius:.625rem;background:var(--color-surface);font-size:.8rem;line-height:1.55;overflow:auto}
.pr-diff span{display:block;padding:0 .875rem;white-space:pre}
.pr-diff .add{background:var(--color-diff-add-bg);color:var(--color-diff-add-fg)}
.pr-diff .del{background:var(--color-diff-del-bg);color:var(--color-diff-del-fg)}
.pr-diff .ctx{color:var(--color-foreground-muted)}
.pr-diff__file{display:block;padding:.4rem .875rem;border-bottom:1px solid var(--color-border);font-weight:600;color:var(--color-foreground-secondary);background:var(--color-background-secondary)}

/* Data table */
.pr-table{border-collapse:separate;border-spacing:0;width:min(100%,72rem);font-size:.95rem;border:1px solid var(--color-border);border-radius:var(--radius);overflow:hidden;background:var(--color-surface)}
.pr-table th{background:var(--color-background-table-header);color:var(--color-foreground-secondary);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:.75rem 1rem}
.pr-table td{padding:.8rem 1rem;color:var(--color-foreground);border-top:1px solid var(--color-border)}
.pr-table td.muted{color:var(--color-foreground-muted)}

/* GitHub PR / issue card */
.pr-gh-card{max-width:42rem;border:1px solid var(--color-github-border);border-radius:.5rem;background:var(--color-github-surface);padding:.75rem 1rem;color:var(--color-github-text)}
.pr-gh-card__repo{font-size:.75rem;color:var(--color-github-muted)}
.pr-gh-card__title{margin-top:.25rem;font-weight:600;line-height:1.35}
.pr-gh-card__title span{font-weight:400;color:var(--color-github-muted);margin-left:.375rem}
.pr-gh-card__state{display:inline-flex;align-items:center;gap:.25rem;margin-top:.5rem;border-radius:999px;padding:.25rem .625rem;font-size:.75rem;font-weight:500;color:#fff}
.pr-gh-card__state--open{background:var(--color-github-open)} .pr-gh-card__state--merged{background:var(--color-github-merged)} .pr-gh-card__state--closed{background:var(--color-github-closed)}

/* Flow made from plain HTML: steps joined by arrows; mark the step that changed with .is-changed */
.pr-flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.75rem}
.pr-flow__step{min-width:9rem;padding:.875rem 1.125rem;border:2px solid var(--color-diagram-external-border);border-radius:.75rem;background:var(--color-surface);text-align:center;font-weight:600;font-size:.95rem}
.pr-flow__step small{display:block;margin-top:.25rem;font-weight:400;font-size:.78rem;color:var(--color-foreground-muted)}
.pr-flow__step.is-changed{border-color:var(--color-diagram-primary-border);background:var(--color-diagram-primary-bg);box-shadow:0 0 0 4px rgba(var(--color-accent-rgb),.12)}
.pr-flow__arrow{color:var(--color-diagram-edge);font-size:1.25rem}
</style>
</head>
<body>
<div class="pr-bg" aria-hidden="true"></div>

<template id="component-reference">
  <!-- ===== COMPONENT REFERENCE: how the components above are used. Never rendered; delete it from the generated deck. =====
       Structure: one cover section (class "slide", data-kind="cover"), then one section per topic with class "slide topic",
       id "topic-N" and data-topic "Short name", holding .pretitle, .title, an optional .lede, an .explain visual and a
       closed details.pr-evidence. Optional libraries (ECharts, Mermaid) load with pinned versions BEFORE #deck-runtime. -->

  <section class="slide" data-kind="cover" id="cover">
    <p class="pretitle">Pull request #482 · owner/repo</p>
    <h1 class="title">Checkout now remembers your cart between visits</h1>
    <div class="pr-cover-grid">
      <div>
        <p class="lede">Why: shoppers lost their cart when the session expired (issue #455). What: carts are saved to the account and restored on sign-in.</p>
        <dl class="pr-stats" style="margin-top:1.5rem">
          <div class="card"><dt>Files</dt><dd>14</dd></div>
          <div class="card"><dt>Added</dt><dd class="add">+612</dd></div>
          <div class="card"><dt>Removed</dt><dd class="del">−148</dd></div>
        </dl>
      </div>
      <div>
        <span class="pr-label">Topics</span>
        <ol class="pr-topic-list"><li><a href="#topic-1">Carts survive sign-out</a></li><li><a href="#topic-2">Faster checkout page</a></li></ol>
      </div>
    </div>
  </section>

  <section class="slide topic" id="topic-1" data-topic="Carts survive sign-out">
    <p class="pretitle">Topic 1 · Saved carts</p>
    <h2 class="title">Shoppers find their cart exactly where they left it</h2>
    <div class="explain">
      <div class="pr-compare">
        <div class="card is-before"><span class="pr-label">Before</span>Cart emptied after 30 minutes</div>
        <div class="card is-after"><span class="pr-label">After</span>Cart restored on next sign-in</div>
      </div>
    </div>
    <details class="pr-evidence">
      <summary><svg class="lucide lucide-file-code" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12.5 8 15l2 2.5"/><path d="m14 12.5 2 2.5-2 2.5"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/></svg>Technical evidence · 3 files</summary>
      <div class="pr-evidence__body">
        <ul class="pr-files">
          <li><span>src/cart/store.ts</span><span class="delta"><span class="pr-badge pr-badge--add">+84</span><span class="pr-badge pr-badge--del">−12</span></span></li>
          <li><span>migrations/0042_saved_carts.sql</span><span class="delta"><span class="pr-badge pr-badge--add">+21</span></span></li>
        </ul>
        <pre class="pr-diff"><code><span class="pr-diff__file">src/cart/store.ts</span><span class="ctx">  export async function loadCart(user) {</span><span class="del">-   return session.get('cart') ?? []</span><span class="add">+   return (await db.carts.find(user.id)) ?? session.get('cart') ?? []</span></code></pre>
        <div class="pr-info pr-info--info"><svg class="lucide lucide-info" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><div>Covered by tests in <code>cart/store.test.ts</code>.</div></div>
      </div>
    </details>
  </section>

  <div class="pr-outcome"><svg class="lucide lucide-target" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><div>Fewer abandoned checkouts.</div></div>

  <div class="pr-flow">
    <div class="pr-flow__step">Sign in<small>account</small></div><span class="pr-flow__arrow">→</span>
    <div class="pr-flow__step is-changed">Restore cart<small>new</small></div><span class="pr-flow__arrow">→</span>
    <div class="pr-flow__step">Checkout</div>
  </div>

<script id="deck-runtime">
/* Deck runtime.
   Deck.onEnter('topic-N', fn): run fn the first time a section scrolls into view
     (charts drawn off-screen get the wrong size). Call it from scripts below this one.
   Deck.chart(id): echarts.init that also resizes with the window (needs ECharts loaded above).
   Deck.token('--name'): read a CSS variable. */
window.Deck = (() => {
  const css = getComputedStyle(document.documentElement);
  const token = (name) => css.getPropertyValue(name).trim();
  const handlers = {}, entered = new Set(), charts = [];
  const onEnter = (id, handler) => { (handlers[id] ||= []).push(handler); };
  const isDark = document.documentElement.classList.contains('dark');
  const chart = (id, theme) => {
    const instance = echarts.init(document.getElementById(id), theme || (isDark ? 'dark' : null), { renderer: 'svg' });
    instance.setOption({ backgroundColor: 'transparent', color: [token('--color-accent'), token('--color-secondary'), token('--color-status-warning'), token('--color-status-danger')],
      textStyle: { fontFamily: token('--font-sans'), color: token('--color-foreground') } });
    charts.push(instance);
    return instance;
  };
  if (window.mermaid) mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'base',
    flowchart: { useMaxWidth: true, htmlLabels: false }, themeVariables: {
    darkMode: isDark, background: token('--color-surface'), primaryColor: token('--color-diagram-primary-bg'),
    primaryBorderColor: token('--color-diagram-primary-border'), primaryTextColor: token('--color-foreground'),
    secondaryColor: token('--color-diagram-secondary-bg'), tertiaryColor: token('--color-surface'),
    mainBkg: token('--color-diagram-primary-bg'), nodeBorder: token('--color-diagram-primary-border'),
    nodeTextColor: token('--color-foreground'), lineColor: token('--color-diagram-edge'),
    textColor: token('--color-foreground'), titleColor: token('--color-foreground'),
    clusterBkg: token('--color-diagram-group-bg'), clusterBorder: token('--color-diagram-group-border'),
    edgeLabelBackground: token('--color-surface'), fontFamily: token('--font-sans'), fontSize: '14px' } });
  const slides = [...document.querySelectorAll('body > .slide')];
  const progress = document.querySelector('.deck-progress i');
  const go = (index) => slides[Math.max(0, Math.min(slides.length - 1, index))].scrollIntoView({ behavior: 'smooth' });
  const navButtons = slides.map((slide, index) => {
    const pretitle = slide.querySelector('.pretitle');
    const button = document.createElement('button');
    button.type = 'button';
    button.innerHTML = '<span class="lbl"></span><span class="dot"></span>';
    button.querySelector('.lbl').textContent = slide.dataset.topic || 'Overview';
    button.setAttribute('aria-label', pretitle ? pretitle.textContent.trim() : 'Overview');
    button.addEventListener('click', () => go(index));
    const item = document.createElement('li');
    item.appendChild(button);
    document.querySelector('.deck-nav ol').appendChild(item);
    return button;
  });
  let current = 0;
  const setCurrent = (index) => {
    current = index;
    navButtons.forEach((button, buttonIndex) => button.setAttribute('aria-current', String(buttonIndex === index)));
  };
  const updateProgress = () => {
    const scrollable = document.documentElement.scrollHeight - innerHeight;
    progress.style.width = (scrollable > 0 ? Math.min(100, scrollY / scrollable * 100) : 100) + '%';
  };
  const enter = (slide) => {
    if (entered.has(slide.id)) return;
    entered.add(slide.id);
    const diagrams = slide.querySelectorAll('pre.mermaid:not([data-processed])');
    if (window.mermaid && diagrams.length) mermaid.run({ nodes: diagrams });
    for (const handler of handlers[slide.id] || []) {
      try { handler(slide); } catch (error) { console.error(slide.id, error); }
    }
  };
  const observer = new IntersectionObserver((entries) => entries.forEach((entry) => {
    if (!entry.isIntersecting) return;
    enter(entry.target);
    if (entry.intersectionRatio > .5) setCurrent(slides.indexOf(entry.target));
  }), { threshold: [0.15, 0.5, 0.75] });
  addEventListener('keydown', (event) => {
    if (event.target.closest('input,textarea,select,summary,details[open]')) return;
    const target = {
      ArrowDown: current + 1, PageDown: current + 1, ArrowRight: current + 1, ' ': current + 1,
      ArrowUp: current - 1, PageUp: current - 1, ArrowLeft: current - 1,
      Home: 0, End: slides.length - 1,
    }[event.key];
    if (target === undefined) return;
    event.preventDefault();
    go(target);
  });
  addEventListener('scroll', updateProgress, { passive: true });
  addEventListener('resize', () => { updateProgress(); charts.forEach((instance) => instance.resize()); });
  addEventListener('DOMContentLoaded', () => { slides.forEach((slide) => observer.observe(slide)); setCurrent(0); updateProgress(); });
  return { onEnter, chart, token, go };
})();
</script>
